name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 22
          - os: windows-2022
            node: 22
          - os: windows-2025
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm typecheck
      - run: pnpm test:acceptance
      - if: runner.os != 'Windows'
        run: pnpm test:helper
      - name: C++20 helper and tests under Chinese Windows code page
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 936 >nul
          node native/hook-helper/run.mjs test
      - run: pnpm build:desktop
      - if: runner.os == 'Windows'
        run: pnpm test:windows
      - run: pnpm test
      - name: Local latency regression (no API credentials)
        run: pnpm test:performance
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.os }}-node${{ matrix.node }}
          path: performance-results/*.json
          if-no-files-found: warn
          retention-days: 30
      - run: pnpm build
      - run: pnpm exec electron tools/check-chat-ui.cjs
      - run: pnpm exec electron tools/check-agent-pings.cjs
      - if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac --dir --publish never
      - if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --publish never --config.extraMetadata.buildCommit=${{ github.sha }}
      - run: node tools/check-packaged-runtime.cjs release
      - name: DSH Windows ACP and packaged model catalog (no API key)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix "$env:USERPROFILE/.local/share/lolpingyourai-dsh" --save-exact @deepseek-ai/dsh@0.2.0-rc.2 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/try-dsh.mjs --qianwen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOLPINGAI_DSH_PATCH = (Resolve-Path examples/dsh-qianwen.patch.yml).Path
          node tools/windows/check-app.mjs release/win-unpacked/LOLPingYourAI.exe --dsh-protocol
      - name: Packaged Windows native regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOLPINGAI_DESKTOP_HELPER = (Resolve-Path 'release/win-unpacked/resources/desktop-helper.exe').Path
          pnpm test:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/windows/check-electron-input.mjs
      - name: NSIS install, app renderer, restart and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/LOLPingYourAI-Setup-*.exe | Select-Object -First 1
          ./tools/windows/check-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: installer-${{ matrix.os }}-node${{ matrix.node }}
          path: release/LOLPingYourAI-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
