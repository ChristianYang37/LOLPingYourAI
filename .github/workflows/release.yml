name: Release desktop installers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/check-release.mjs
  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-2022-node22
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: installer-macos-arm64
          path: release
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/LOLPingYourAI-Setup-*.exe release/LOLPingYourAI-*-arm64.dmg --verify-tag --title "LOLPingYourAI $RELEASE_TAG — macOS & Windows" --notes-file "docs/releases/$RELEASE_TAG.md"
