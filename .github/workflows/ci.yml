name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm typecheck
      - run: pnpm test:acceptance
      - run: pnpm test:helper
      - run: pnpm build:desktop
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac --dir --publish never
      - if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --dir --publish never
      - run: node tools/check-packaged-runtime.cjs release
